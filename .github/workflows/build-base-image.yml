name: Build ML Base Image with Ollama

on:
  # Manual trigger only (for now)
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to pre-download (comma-separated)'
        required: true
        default: 'gemma3:270m,nomic-embed-text'
        type: string
  
  # Weekly rebuild (Sunday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'
  
  # When base Dockerfile or requirements change
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'backend/Dockerfile.base'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cerebrum-ml-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ollama
            type=raw,value=ollama-${{ github.run_number }}
            type=sha,prefix=ollama-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MODELS=${{ github.event.inputs.models || 'gemma3:270m,nomic-embed-text' }}

      - name: Image summary
        run: |
          echo "✅ Base image built successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ollama"
          echo ""
          echo "To use in your main Dockerfile:"
          echo "  FROM ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ollama"
