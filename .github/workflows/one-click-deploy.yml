# One-Click Full Stack Deployment
# Run this manually from GitHub Actions tab
name: 🚀 One-Click Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_backend:
        description: 'Deploy Backend to Cloud Run?'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend to Firebase?'
        required: true
        default: true
        type: boolean

env:
  PROJECT_ID: cerebrum-30d9c
  REGION: us-central1
  BACKEND_SERVICE: cerebrum-backend

jobs:
  # ==========================================
  # Pre-flight Checks
  # ==========================================
  check-secrets:
    name: 🔍 Check Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check GCP_SA_KEY
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ GCP_SA_KEY is not set!"
            echo "Go to: https://console.cloud.google.com/iam-admin/serviceaccounts"
            echo "Create key for 'github-actions' service account"
            echo "Add to GitHub Secrets as: GCP_SA_KEY"
            exit 1
          fi
          echo "✅ GCP_SA_KEY is set"

      - name: Check FIREBASE_SERVICE_ACCOUNT
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT is not set!"
            echo "Go to: https://console.firebase.google.com/project/cerebrum-30d9c/settings/serviceaccounts/adminsdk"
            echo "Generate new private key"
            echo "Add to GitHub Secrets as: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          echo "✅ FIREBASE_SERVICE_ACCOUNT is set"

  # ==========================================
  # Deploy Backend
  # ==========================================
  deploy-backend:
    name: 🐍 Deploy Backend
    runs-on: ubuntu-latest
    needs: check-secrets
    if: github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build & Push
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            -f backend/Dockerfile.cloudrun \
            backend/
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 80 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "ENVIRONMENT=production,DEBUG=false,CORS_ORIGINS=https://cerebrum-30d9c.web.app,https://cerebrum-landing.web.app" \
            --set-secrets "DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,SECRET_KEY=secret-key:latest"
          
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  # ==========================================
  # Deploy Frontend
  # ==========================================
  deploy-frontend:
    name: ⚛️ Deploy Frontend
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-backend]
    if: github.event.inputs.deploy_frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.PROJECT_ID }}
          target: frontend

  # ==========================================
  # Summary
  # ==========================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Results
        run: |
          echo "## 🚀 Deployment Complete!"
          echo ""
          echo "| Component | Status |"
          echo "|-----------|--------|"
          echo "| Backend | ${{ needs.deploy-backend.result }} |"
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |"
          echo ""
          echo "URLs:"
          echo "- Frontend: https://cerebrum-30d9c.web.app"
          echo "- API: https://cerebrum-30d9c.web.app/api/"
          echo "- Docs: https://cerebrum-30d9c.web.app/docs"
