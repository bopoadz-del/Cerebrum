# Deploy Frontend to Firebase + Trigger Backend Deploy on Render
name: Deploy All Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # Deploy Frontend to Firebase Hosting
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://cerebrum-api.onrender.com' }}

      - name: Deploy Frontend to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEREBRUM_30D9C }}
          channelId: live
          projectId: cerebrum-30d9c
          target: frontend

  # ==========================================
  # Deploy Landing Page to Firebase Hosting
  # ==========================================
  deploy-landing:
    name: Deploy Landing Page to Firebase
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Landing to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEREBRUM_30D9C }}
          channelId: live
          projectId: cerebrum-30d9c
          target: landing

  # ==========================================
  # Trigger Backend Deploy on Render
  # ==========================================
  deploy-backend:
    name: Trigger Backend Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'backend/')
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Backend deploy triggered on Render"
          else
            echo "RENDER_DEPLOY_HOOK not set - skipping backend deploy trigger"
          fi

  # ==========================================
  # Deploy Status Summary
  # ==========================================
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-landing, deploy-backend]
    if: always()
    steps:
      - name: Post Deploy Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && '✅ Success' || '❌ Failed' }} | https://cerebrum-30d9c.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | ${{ needs.deploy-landing.result == 'success' && '✅ Success' || '❌ Failed' }} | https://cerebrum-landing.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result == 'success' && '✅ Triggered' || needs.deploy-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | https://cerebrum-api.onrender.com |" >> $GITHUB_STEP_SUMMARY
