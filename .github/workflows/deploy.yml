# =============================================================================
# CI/CD — Firebase Hosting (frontend) + Cloud Run (backend)
# Project: cerebrum-30d9c
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  GCP_PROJECT: cerebrum-30d9c
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cerebrum-backend
  REGISTRY: gcr.io

jobs:
  # ── Backend: Build → Push → Deploy to Cloud Run ───────────────────────────
  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      backend_url: ${{ steps.get-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -f backend/Dockerfile.cloudrun -t "$IMAGE" backend/
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "^|^ENVIRONMENT=production|DEBUG=false|CORS_ORIGINS=https://cerebrum-30d9c.web.app,https://cerebrum-30d9c.firebaseapp.com" \
            --set-secrets "DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,REDIS_URL=redis-url:latest" \
            --project ${{ env.GCP_PROJECT }}

      - name: Grant Firebase Hosting run.invoker IAM
        run: |
          # Firebase Hosting needs run.invoker to proxy /api/** to Cloud Run
          gcloud run services add-iam-policy-binding ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --member "serviceAccount:service-$(gcloud projects describe ${{ env.GCP_PROJECT }} --format='value(projectNumber)')@gcp-sa-firebasehosting.iam.gserviceaccount.com" \
            --role "roles/run.invoker" || true

      - name: Get Cloud Run URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' \
            --project ${{ env.GCP_PROJECT }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $URL"

      - name: Health check
        run: |
          sleep 10
          curl -f "${{ steps.get-url.outputs.url }}/health/live" || exit 1

      - name: Run DB Migrations (Alembic)
        run: |
          echo "Running Alembic migrations via Cloud Run job..."
          gcloud run jobs create cerebrum-migrate-${{ github.run_number }} \
            --image gcr.io/${{ env.GCP_PROJECT }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --set-secrets "DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest" \
            --command "alembic" \
            --args "upgrade,head" \
            --max-retries 1 \
            --task-timeout 300 || echo "Migration job create failed — may already exist"
          gcloud run jobs execute cerebrum-migrate-${{ github.run_number }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --wait || echo "Migration warning — check logs but continuing deploy"

  # ── Frontend: Build → Deploy to Firebase Hosting ─────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}/api/v1
        run: cd frontend && npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA_KEY }}
          projectId: cerebrum-30d9c
          channelId: live
