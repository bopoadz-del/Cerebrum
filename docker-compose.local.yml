version: '3.8'

# =============================================================================
# Cerebrum Local Development Stack with Optional MLflow
# =============================================================================
#
# Usage:
#   # Start core services only (no MLflow):
#   docker-compose -f docker-compose.local.yml up -d
#
#   # Start with MLflow:
#   docker-compose -f docker-compose.local.yml -f docker-compose.mlflow.yml up -d
#
#   # Start everything:
#   docker-compose -f docker-compose.local.yml -f docker-compose.mlflow.yml --profile proxy up -d
#
# =============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database for Local Development
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: cerebrum-local-postgres
    environment:
      POSTGRES_USER: cerebrum
      POSTGRES_PASSWORD: cerebrum_local_dev
      POSTGRES_DB: cerebrum_local
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./data/diriyah_docs:/data/diriyah_docs:ro  # Mount documents for processing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebrum"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerebrum-network

  # ==========================================================================
  # Redis Cache & Queue
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: cerebrum-local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerebrum-network

  # ==========================================================================
  # Backend API - Local Development Mode
  # ==========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebrum-local-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - /app/__pycache__
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://cerebrum:cerebrum_local_dev@postgres:5432/cerebrum_local
      - REDIS_URL=redis://redis:6379/0
      
      # Security
      - SECRET_KEY=local-development-secret-key-must-be-at-least-32-chars-long
      - DEBUG=true
      - ENVIRONMENT=development
      
      # CORS
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:5000
      
      # Feature Flags
      - USE_STUB_CONNECTORS=true
      - USE_STUB_ML=true
      - USE_STUB_NOTIFICATIONS=true
      
      # Local Data
      - LOCAL_DATA_PATH=/data/diriyah_docs
      - WATCH_LOCAL_FILES=true
      
      # MLflow (used when MLflow stack is running)
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - cerebrum-network
      - mlflow-network  # Connect to MLflow network when available

  # ==========================================================================
  # Celery Worker - Fast Queue (Local)
  # ==========================================================================
  worker-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebrum-local-worker-fast
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:cerebrum_local_dev@postgres:5432/cerebrum_local
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=local-development-secret-key-must-be-at-least-32-chars-long
      - DEBUG=true
      - ENVIRONMENT=development
      - USE_STUB_CONNECTORS=true
      - USE_STUB_ML=true
      # MLflow config
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./backend:/app
      - ./data:/data
      - /app/__pycache__
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_config worker --loglevel=info -Q celery_fast -n fast_worker@%h --concurrency=2
    networks:
      - cerebrum-network
      - mlflow-network

  # ==========================================================================
  # Celery Worker - Slow Queue (Local)
  # ==========================================================================
  worker-slow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebrum-local-worker-slow
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:cerebrum_local_dev@postgres:5432/cerebrum_local
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=local-development-secret-key-must-be-at-least-32-chars-long
      - DEBUG=true
      - ENVIRONMENT=development
      - USE_STUB_CONNECTORS=true
      - USE_STUB_ML=true
      # MLflow config
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./backend:/app
      - ./data:/data
      - /app/__pycache__
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_config worker --loglevel=info -Q celery_slow -n slow_worker@%h --concurrency=1
    networks:
      - cerebrum-network
      - mlflow-network

  # ==========================================================================
  # Celery Beat Scheduler (Local)
  # ==========================================================================
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebrum-local-scheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:cerebrum_local_dev@postgres:5432/cerebrum_local
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=local-development-secret-key-must-be-at-least-32-chars-long
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_config beat --loglevel=info
    networks:
      - cerebrum-network

  # ==========================================================================
  # Frontend Development Server
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cerebrum-local-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MLFLOW_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - api
    networks:
      - cerebrum-network

# =============================================================================
# Networks
# =============================================================================
networks:
  cerebrum-network:
    name: cerebrum-local-network
    driver: bridge
  
  # External reference to MLflow network (created by docker-compose.mlflow.yml)
  mlflow-network:
    external: true
    name: cerebrum-mlflow-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_local_data:
  redis_local_data:
