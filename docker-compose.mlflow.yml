version: '3.8'

# =============================================================================
# MLflow Server Stack for Cerebrum
# =============================================================================
# This stack provides:
# - MLflow tracking server (port 5000)
# - PostgreSQL database for metadata storage
# - MinIO S3-compatible object storage for artifacts
#
# Usage:
#   docker-compose -f docker-compose.mlflow.yml up -d
#   docker-compose -f docker-compose.mlflow.yml -f docker-compose.local.yml up -d
# =============================================================================

services:
  # ==========================================================================
  # PostgreSQL - MLflow Metadata Store
  # ==========================================================================
  mlflow-db:
    image: postgres:15-alpine
    container_name: cerebrum-mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port to avoid conflict with main postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlflow-network
    restart: unless-stopped

  # ==========================================================================
  # MinIO - S3-Compatible Artifact Store
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: cerebrum-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: mlflow
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mlflow-network
    restart: unless-stopped

  # ==========================================================================
  # MinIO Bucket Setup
  # ==========================================================================
  minio-setup:
    image: minio/mc:latest
    container_name: cerebrum-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 10;
        /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123;
        /usr/bin/mc mb local/mlflow --ignore-existing;
        /usr/bin/mc policy set public local/mlflow;
        exit 0;
      "
    networks:
      - mlflow-network
    restart: "no"

  # ==========================================================================
  # MLflow Server
  # ==========================================================================
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: cerebrum-mlflow-server
    environment:
      # Backend Store (PostgreSQL)
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:mlflow_password@mlflow-db:5432/mlflow_db
      
      # Default Artifact Root (MinIO S3)
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow
      
      # S3 Endpoint Configuration
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      
      # Server Configuration
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: 5000
      
      # Optional: Enable prometheus metrics
      MLFLOW_PROMETHEUS_ENABLED: "false"
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@mlflow-db:5432/mlflow_db
      --default-artifact-root s3://mlflow
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - mlflow_server_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mlflow-network
    restart: unless-stopped

  # ==========================================================================
  # MLflow UI Proxy (optional - for external access)
  # ==========================================================================
  mlflow-proxy:
    image: nginx:alpine
    container_name: cerebrum-mlflow-proxy
    volumes:
      - ./nginx.mlflow.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5050:80"
    depends_on:
      - mlflow-server
    networks:
      - mlflow-network
    restart: unless-stopped
    profiles:
      - proxy  # Only started with --profile proxy

# =============================================================================
# Networks
# =============================================================================
networks:
  mlflow-network:
    name: cerebrum-mlflow-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mlflow_postgres_data:
    name: cerebrum-mlflow-postgres-data
  minio_data:
    name: cerebrum-minio-data
  mlflow_server_data:
    name: cerebrum-mlflow-server-data
