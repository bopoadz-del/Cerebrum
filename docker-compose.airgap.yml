version: '3.8'

# =============================================================================
# Cerebrum Air-Gapped Deployment
# Complete offline-capable deployment with local LLM (Ollama)
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cerebrum-postgres
    environment:
      POSTGRES_USER: cerebrum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerebrum_secure_local}
      POSTGRES_DB: cerebrum
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # Local only for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebrum"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerebrum-network
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: cerebrum-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Local only for security
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerebrum-network
    restart: unless-stopped

  # Ollama Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: cerebrum-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # Local only for security
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - cerebrum-network
    restart: unless-stopped
    # GPU support (uncomment if GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.airgap
    container_name: cerebrum-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:${POSTGRES_PASSWORD:-cerebrum_secure_local}@postgres:5432/cerebrum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-min-32-chars}
      - DEBUG=false
      - ENVIRONMENT=production
      - OLLAMA_HOST=http://ollama:11434
      - DISABLE_EXTERNAL_AI=true
      - OFFLINE_MODE=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./data:/data:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - cerebrum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Celery Worker - Fast Queue
  worker-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile.airgap
    container_name: cerebrum-worker-fast
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:${POSTGRES_PASSWORD:-cerebrum_secure_local}@postgres:5432/cerebrum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-min-32-chars}
      - OLLAMA_HOST=http://ollama:11434
      - DISABLE_EXTERNAL_AI=true
      - OFFLINE_MODE=true
    volumes:
      - ./data:/data:ro
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - cerebrum-network
    restart: unless-stopped
    command: celery -A app.workers.celery_config worker --loglevel=info -Q celery_fast -n fast_worker@%h --concurrency=2

  # Celery Worker - Slow Queue
  worker-slow:
    build:
      context: ./backend
      dockerfile: Dockerfile.airgap
    container_name: cerebrum-worker-slow
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebrum:${POSTGRES_PASSWORD:-cerebrum_secure_local}@postgres:5432/cerebrum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-min-32-chars}
      - OLLAMA_HOST=http://ollama:11434
      - DISABLE_EXTERNAL_AI=true
      - OFFLINE_MODE=true
    volumes:
      - ./data:/data:ro
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - cerebrum-network
    restart: unless-stopped
    command: celery -A app.workers.celery_config worker --loglevel=info -Q celery_slow -n slow_worker@%h --concurrency=1

  # Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.airgap
    container_name: cerebrum-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - cerebrum-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  uploads_data:
    driver: local

networks:
  cerebrum-network:
    driver: bridge
    internal: false
